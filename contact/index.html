<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | TAG Inc.</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div id="header"></div>

  <main class="split-layout contact-page">
    <section class="split-section">
      <div class="sticky-box">
        <h1 class="title">Contact</h1>
      </div>

      <div class="content-box">
        <div class="contact-intro">
          <p class="intro-text">
            Please feel free to contact me for consultations or project estimates. <br>
            I will review your inquiry and get back to you shortly.
          </p>
          <p class="faq-link">
            *Please check our <a href="faq.html">Frequently Asked Questions</a> before sending a message.
          </p>
        </div>

        <form action="https://formspree.io/f/xlgwkneb" method="POST" class="contact-form">
          <input type="text" name="_gotcha" style="display:none">
          <input type="hidden" name="_next" value="/thanks.html">

          <div class="form-group-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first_name" required placeholder="Jane">
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last_name" required placeholder="Doe">
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="jane.doe@example.com">
          </div>

          <div class="form-group">
            <label for="tel">Phone Number</label>
            <input type="tel" id="tel" name="tel" placeholder="(213) 555-0123">
          </div>

          <div class="form-group">
            <label for="address">Project Location (City, State)</label>
            <input type="text" id="address" name="location" placeholder="e.g. Santa Monica, CA">
          </div>

          <div class="form-group">
            <label for="inquiry">Inquiry Type</label>
            <select id="inquiry" name="inquiry_type">
              <option value="" disabled selected>Select an option</option>
              <option value="Condo Renovation">Condo Renovation</option>
              <option value="Kitchen & Bath Remodeling">Kitchen & Bath Remodeling</option>
              <option value="Interior Design & FFE">Interior Design & FFE</option>
              <option value="Full House Renovation">Full House Renovation</option>
              <option value="Commercial Design">Commercial Design</option>
              <option value="Consultation">Consultation</option>
            </select>
          </div>

          <div class="form-group">
            <label>Preferred Method of Contact</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="contact_method" value="Email" checked> Email</label>
              <label class="radio-label"><input type="radio" name="contact_method" value="Phone"> Phone</label>
              <label class="radio-label"><input type="radio" name="contact_method" value="Text"> Text Message</label>
            </div>
          </div>

          <div class="form-group">
            <label for="message">Project Details</label>
            <textarea id="message" name="message" rows="5" required placeholder="Please describe your project goals, timeline, and any specific requirements..."></textarea>
          </div>

          <button type="submit" class="submit-btn">SEND INQUIRY</button>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/common.js" defer></script>
</body>
</html>
