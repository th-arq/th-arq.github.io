  <!-- JS -->
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const swiper = new Swiper('.top-slider', {
  loop: true, // ループ
  speed: 1000, // 切り替わりのアニメーション速度（ms）
  autoplay: {
    delay: 3000, // 3秒ごとに自動切り替え
    disableOnInteraction: false, // ユーザー操作後も自動再開
  },
  pagination: {
    el: '.swiper-pagination',
    clickable: true,
  },
});
  

  const burger = document.querySelector('.hamburger');
  const menu = document.querySelector('#menu');
  const titleArea = document.querySelector('#title_area');

  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    menu.classList.toggle('open');
    titleArea.classList.toggle('open');
  });

  AOS.init({
    duration: 1000,
    once: true
  });
});
</script>
