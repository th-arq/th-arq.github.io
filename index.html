<script>
window.addEventListener('load', () => {

  const loading  = document.getElementById('loading');
  const mainview = document.getElementById('Mainview');
  const header   = document.querySelector('header');
  const footer   = document.querySelector('footer');

  if (!loading || !mainview || !header || !footer) return;

  const LOADING_TIME = 1000;

  // 初期状態
  [header, footer, mainview].forEach(el => el.style.opacity = '0');

  setTimeout(() => {

    // loading消す
    loading.style.opacity = '0';

    setTimeout(() => {
      loading.remove();

      // header / footer 表示
      header.style.transition = footer.style.transition = 'opacity 0.5 ease';
      header.style.opacity = footer.style.opacity = '1';

      // swiper 表示
      setTimeout(() => {

        mainview.style.opacity = '1';

        new Swiper('.top-slider', {
          loop: true,
          effect: 'fade',
          fadeEffect: { crossFade: true },
          speed: 1500,
          autoplay: {
            delay: 5000,
            disableOnInteraction: false
          },
          pagination: {
            el: '.swiper-pagination',
            clickable: true
          }
        });

      }, 400);

    }, 300);

  }, LOADING_TIME);

});
</script>
