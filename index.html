<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-type" content="text/html; charset=UTF-8">
<title>TAG Inc.</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
<style>
  main { display: block; padding: 0; }
  header, footer { opacity: 0; transition: opacity 1s ease; }
  #Mainview { display: block; opacity: 0; width: 100%; height: 100vh; transition: opacity 1s ease; }
  .top-slider { width: 90%; height: 100%; margin: auto; }
  .top-slider img { width: 100%; height: 100%; object-fit: cover; }
  .swiper-pagination-bullet-active { background: #fff!important; }
</style>
</head>
<body class="page-fade">

<!-- Loading -->
<div id="loading">
  <svg class="loading_logo_svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 675 676">
    <!-- SVG path省略 -->
  </svg>
</div>

<!-- HEADER -->
<header>
  <div id="title_area">
    <div class="hamburger"><span></span><span></span></div>
    <div class="TAG_logo">
      <a href="https://th-arq.github.io/">
        <svg class="logo_svg"></svg>
      </a>
    </div>      
  </div>
  <div id="menu">
    <nav>
      <ul>
        <li><a href="/about/">About</a></li>
        <li><a href="/service/">Service</a></li>
        <li><a href="/projects/">Projects</a></li>
        <li><a href="/contact/">Contact</a></li>
      </ul>
    </nav>
  </div>
  <div id="overlay"></div>
</header>

<!-- CONTENT -->
<main>
  <div id="Mainview">
    <div class="swiper top-slider">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="img/img1.jpg" alt=""></div>
        <div class="swiper-slide"><img src="img/img2.jpg" alt=""></div>
        <div class="swiper-slide"><img src="img/img3.jpg" alt=""></div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <div class="footer_container">
    <div class="footer_container_information">
      <p>INTERIOR & EXTERIOR · Residential · Commercial · Industrial</p>
      <p>Los Angeles, CA | <a href="/privacy/">Privacy Policy</a></p>
    </div>
    <div class="footer_container_company">
      <p>© 2025 TAG Inc.  Licensed Contractor #123456</p>
    </div>
  </div>
</footer>

<!-- Swiper JS（先に読み込む！） -->
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

<!-- 直書きJS -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('overlay');
  const burger = document.querySelector('.hamburger');
  const menu = document.getElementById('menu');
  const titleArea = document.getElementById('title_area');
  const menuLinks = menu ? menu.querySelectorAll('a') : [];
  const pageFades = document.querySelectorAll('.page-fade');

  function closeMenu() {
    burger.classList.remove('open');
    menu.classList.remove('open');
    titleArea.classList.remove('open');
    overlay.classList.remove('active');
  }

  if (burger && menu && overlay && titleArea) {
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      menu.classList.toggle('open');
      titleArea.classList.toggle('open');
      overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', closeMenu);

    document.addEventListener('click', (e) => {
      if (!menu.classList.contains('open')) return;
      if (menu.contains(e.target) || burger.contains(e.target)) return;
      closeMenu();
    });

    menuLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const url = link.getAttribute('href');
        closeMenu();
        pageFades.forEach(el => el.classList.add('fade-out'));
        setTimeout(() => { window.location.href = url; }, 800);
      });
    });
  }

  pageFades.forEach(el => el.classList.add('loaded'));
});

window.addEventListener('load', () => {
  const loading = document.getElementById('loading');
  const mainview = document.getElementById('Mainview');
  const header = document.querySelector('header');
  const footer = document.querySelector('footer');
  const pageFades = document.querySelectorAll('.page-fade');

  if (!loading || !mainview || !header || !footer) return;

  const MIN_LOADING_TIME = 2500;
  const startTime = performance.now();
  const elapsed = performance.now() - startTime;
  const remaining = Math.max(0, MIN_LOADING_TIME - elapsed);

  setTimeout(() => {
    loading.style.opacity = '0';
    setTimeout(() => {
      loading.style.display = 'none';
      mainview.style.display = 'block';

      // Swiper 初期化
      const swiper = new Swiper('.top-slider', {
        loop: true,
        speed: 1000,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: '.swiper-pagination', clickable: true },
      });

      // Header/Footer フェードイン
      header.style.opacity = '0';
      footer.style.opacity = '0';
      setTimeout(() => {
        header.style.transition = 'opacity 1.2s ease';
        footer.style.transition = 'opacity 1.2s ease';
        header.style.opacity = '1';
        footer.style.opacity = '1';
      }, 200);

      // ページ全体フェードイン
      pageFades.forEach(el => el.classList.add('loaded'));
    }, 500);
  }, remaining);
});
</script>

</body>
</html>
