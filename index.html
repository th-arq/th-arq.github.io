<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAG Inc.</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-index">

  <div id="loading">
    <div class="loading_inner">
      <div class="logo_wrapper">
        <svg class="loading_logo_svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 675 676">
          <path fill="currentColor" fill-rule="evenodd" d="M644.32 337.51c0 163.14-127.22 296.55-287.82 306.37V10.98q13.59.83 26.83 2.82v591.95l19.02-6.17c34.51-11.22 85.26-36.91 127.18-79.3 42.18-42.62 75.77-102.58 73.99-181.42l-.32-14.2H460.45v29.07h113.9c-2.42 62.37-30.22 110.47-65.48 146.1-30.92 31.27-67.35 52.64-96.48 64.95v-525c133.25 33.44 231.93 154.06 231.93 297.73Zm-613.64 0c0-162.94 126.92-296.23 287.26-306.32v634.35a308 308 0 0 1-21.24-2.08V77.2l-16.88 2.76c-41.61 6.83-93.1 34.56-134.22 77.73-41.38 43.45-73.39 103.7-73.87 176.37-.3 44.22 11.1 92.38 38.35 143.37l25.63-13.7c-22.13-41.4-32.52-79.92-34.55-115.03h166.48v287.76C131.84 604.83 30.68 483 30.68 337.51Zm316.32 337c181.73-5.03 327.5-153.98 327.5-337C674.5 154.5 528.73 5.55 347 .51zm-20.12-.03V.55C145.68 6.15.5 154.88.5 337.5c0 182.64 145.18 331.36 326.38 336.97Zm-59.24-354.86H101.37c4.24-57.36 30.78-105.66 65.27-141.87 31.75-33.34 69.45-55.6 101-65.12z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div id="loading_percent">0%</div>
    </div>
  </div>

  <div id="header"></div>

  <main class="index-page">
    <section class="index-hero">

      <!-- 左: コピー -->
      <div class="index-hero-left">
        <div class="index-hero-copy">
          <div class="index-hero-loc" id="heroLoc">Los Angeles, CA</div>
          <h1 class="index-hero-h1">
            <span class="ih-line"><span>Built for the</span></span>
            <span class="ih-line"><span>way you</span></span>
            <span class="ih-line"><span><em>live.</em></span></span>
          </h1>
          <p class="index-hero-sub" id="heroSub">
            Interior&nbsp;&nbsp;·&nbsp;&nbsp;Exterior<br>
            Architecture&nbsp;&nbsp;·&nbsp;&nbsp;Construction
          </p>
        </div>
        <div class="index-hero-cta" id="heroCta">
          <a href="/projects/" class="ihc-main">View Projects →</a>
          <a href="/contact/" class="ihc-sub">Get in touch</a>
        </div>
      </div>

      <!-- 右: スライダー + カテゴリ -->
      <div class="index-hero-right">

        <!-- メインスライダー -->
        <div class="index-slider" id="indexSlider">
          <div class="is-slide" data-index="0">
            <div class="is-slide-inner">
              <img src="/projects/012/img/001.webp" alt="Interior">
            </div>
          </div>
          <div class="is-slide" data-index="1">
            <div class="is-slide-inner">
              <img src="/projects/018/img/001.webp" alt="Exterior">
            </div>
          </div>
          <div class="is-slide" data-index="2">
            <div class="is-slide-inner">
              <img src="/projects/001/img/001.webp" alt="Residential">
            </div>
          </div>
          <div class="is-slide" data-index="3">
            <div class="is-slide-inner">
              <img src="/projects/015/img/002.webp" alt="Commercial ">
            </div>
          </div>
          <!-- プログレスバー -->
          <div class="is-progress-wrap">
            <div class="is-progress-bar" id="isProgressBar"></div>
          </div>
          <!-- ドット -->
          <div class="is-dots" id="isDots"></div>
        </div>

        <!-- カテゴリグリッド -->
        <div class="index-cats" id="indexCats">
          <a href="/services/#interior" class="ic-item" data-cat="0">
            <img src="/projects/012/img/003.webp" alt="Interior">
            <div class="ic-overlay">
              <span class="ic-num">01</span>
              <span class="ic-name">Interior</span>
            </div>
          </a>
          <a href="/services/#exterior" class="ic-item" data-cat="1">
            <img src="/projects/013/img/001.webp" alt="Exterior">
            <div class="ic-overlay">
              <span class="ic-num">02</span>
              <span class="ic-name">Exterior</span>
            </div>
          </a>
          <a href="/services/#architecture" class="ic-item" data-cat="2">
            <img src="/projects/018/img/003.webp" alt="Architecture">
            <div class="ic-overlay">
              <span class="ic-num">03</span>
              <span class="ic-name">Commercial</span>
            </div>
          </a>
          <a href="/services/#construction" class="ic-item" data-cat="3">
            <img src="/projects/015/img/003.webp" alt="Construction">
            <div class="ic-overlay">
              <span class="ic-num">04</span>
              <span class="ic-name">Construction</span>
            </div>
          </a>
        </div>

      </div>
    </section>

    <!-- Testimonial 
    <section class="index-testimonial" id="indexTestimonial">
      <div class="it-line"></div>
      <div class="it-body">
        <p class="it-quote">"TAG completely transformed our home. They handled everything — from the initial drawings to the final walkthrough. <em>We couldn't be happier.</em>"</p>
        <p class="it-meta">— Sarah M.&nbsp;&nbsp;·&nbsp;&nbsp;Bel Air, Los Angeles</p>
      </div>
    </section>-->

    <!-- Trust bar -->
    <div class="index-trust" id="indexTrust">
      <div class="itr-item">
        <div class="itr-dot"></div>
        <div class="itr-text">Serving LA California</div>
      </div>
      <div class="itr-item">
        <div class="itr-dot"></div>
        <div class="itr-text">Licensed &amp; Insured</div>
      </div>
      <div class="itr-item">
        <div class="itr-dot"></div>
        <div class="itr-text">One Team, Start to Finish</div>
      </div>
      <div class="itr-item">
        <div class="itr-dot"></div>
        <div class="itr-text">Interior design &amp; Residential</div>
      </div>
    </div>

  </main>

  <div id="footer"></div>

  <script src="js/common.js" defer></script>
  <script src="js/index.js" defer></script>
</body>
</html>
