<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABOUT</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div id="header"></div>

  <main class="about-page projects">

    <nav class="filter-nav">
     <button class="filter-btn active" data-filter="all">All</button>
     <button class="filter-btn" data-filter="civic-gov">Civic + Government</button>
     <button class="filter-btn" data-filter="residential">Residential</button>
    </nav>

  <section class="projects-grid">
    <article class="projects-item civic-gov">
      <div class="thumbnail">
        <img src="./img/001/img1.jpg" alt="City Hall Design">
      </div>
      <div class="info">
        <h3>Project Title 01</h3>
        <p>Civic + Government</p>
      </div>
    </article>

    <article class="projects-item residential">
      <div class="thumbnail">
        <img src="./img/001/img1.jpg" alt="Modern House">
      </div>
      <div class="info">
        <h3>Project Title 02</h3>
        <p>Residential</p>
      </div>
    </article>

    </section>
</main>

  <div id="footer"></div>

  <script src="../js/projects.js" defer></script>
  <script src="../js/common.js" defer></script>
</body>
</html>
